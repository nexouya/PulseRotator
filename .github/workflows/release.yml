name: Release & Build PulseRotator

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-tauri:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Setup Core Binaries (Mihomo & Wintun)
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          curl -L -o mihomo.zip "https://github.com/MetaCubeX/mihomo/releases/download/v1.19.30/mihomo-windows-amd64-compatible-v1.19.30.zip"
          unzip -o mihomo.zip -d mihomo_temp
          cp mihomo_temp/mihomo-windows-amd64-compatible.exe src-tauri/binaries/mihomo-x86_64-pc-windows-msvc.exe
          cp mihomo_temp/mihomo-windows-amd64-compatible.exe src-tauri/binaries/mihomo.exe
          curl -L -o wintun.zip "https://www.wintun.net/builds/wintun-0.14.1.zip"
          unzip -o wintun.zip -d wintun_temp
          cp wintun_temp/wintun/bin/amd64/wintun.dll src-tauri/binaries/wintun.dll

      - name: Install Frontend Dependencies
        run: npm install

      - name: Build Frontend & Tauri App
        shell: bash
        run: |
          npx tauri build --verbose

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PulseRotator-Windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/*.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: 'PulseRotator ${{ github.ref_name }}'
          body: 'PulseRotator production Windows desktop application.'
          draft: false
          prerelease: false
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/*.exe
